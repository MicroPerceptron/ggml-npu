[package]
name = "ggml-npu-cache-codec-bench"
version = "0.1.0"
edition = "2024"

[features]
default = ["bundled-zstd", "structured-simd", "zrip-simd", "lz4-safe"]
bundled-zstd = ["dep:zstd"]
structured-simd = [
    "structured-zstd/kernel_sse2",
    "structured-zstd/kernel_bmi2",
    "structured-zstd/kernel_avx2",
    "structured-zstd/kernel_neon",
    "structured-zstd/kernel_sve",
    "structured-zstd/kernel_simd128",
]
zrip-simd = ["zrip/simd"]
lz4-safe = [
    "lz4_flex/safe-encode",
    "lz4_flex/safe-decode",
    "lz4_flex/checked-decode",
]
zstd-fat-lto = ["zstd/fat-lto"]
zstd-no-asm = ["zstd/no_asm"]
zstd-pkg-config = ["zstd/pkg-config"]
zstd-thin-lto = ["zstd/thin-lto"]
zstd-thin-minified = ["zstd/thin"]

[dependencies]
libloading = "0.9.0"
lz4_flex = { version = "0.13.1", default-features = false }
serde_json = "1.0.150"
structured-zstd = { version = "0.0.48", default-features = false, features = ["std", "hash"] }
zrip = { version = "0.8.3", default-features = false, features = ["std", "frame", "ldm"] }
zstd = { version = "0.13.3", default-features = false, optional = true }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
