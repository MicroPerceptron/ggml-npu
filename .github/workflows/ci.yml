name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

env:
  LLAMA_CPP_REF: 29c720eaf72fcf8e4e61a56a88b994d92668261d

jobs:
  lavapipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ggml-org/llama.cpp
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install build dependencies and software Vulkan
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake ninja-build mesa-vulkan-drivers libvulkan1
      - name: Configure paths and require lavapipe
        shell: bash
        run: |
          echo "GGML_DIR=$GITHUB_WORKSPACE/llama.cpp" >> "$GITHUB_ENV"
          echo "GGML_LIB_DIR=$GITHUB_WORKSPACE/llama.cpp/build/bin" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$GITHUB_WORKSPACE/llama.cpp/build/bin" >> "$GITHUB_ENV"
          ICD=$(find /usr/share/vulkan/icd.d -name '*lvp*.json' -print -quit)
          test -n "$ICD"
          echo "VK_DRIVER_FILES=$ICD" >> "$GITHUB_ENV"
      - name: Build unmodified ggml and llama-cli
        run: |
          cmake -S llama.cpp -B llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DGGML_BACKEND_DL=ON -DGGML_NATIVE=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-cli -j 2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - run: cargo build --locked --release
      - name: Discover external plugin in llama.cpp
        run: |
          GGML_BACKEND_PATH="$GITHUB_WORKSPACE/target/release/libggml_npu.so" llama.cpp/build/bin/llama-cli --list-devices | tee devices.txt
          grep -q VIRTIO_VULKAN devices.txt
      - name: Compare Vulkan graph execution with ggml CPU
        run: bash tests/run_bridge_check.sh
