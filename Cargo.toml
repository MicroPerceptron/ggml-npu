[package]
name = "ggml-npu"
version = "0.5.0"
edition = "2024"
description = "Out-of-tree ggml backend backed by virtio-accel"
license = "MIT"
publish = false
autotests = false
autobenches = false

[lib]
path = "src/bridge/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["vulkan"]
vulkan = ["dep:virtio-accel-vulkan"]
coreml = ["dep:virtio-accel-coreml"]

[dependencies]
virtio-accel-core = { git = "https://github.com/MicroPerceptron/virtio-accel", rev = "8b66e79b6d889886fb22b0c9e72d868ff96fc9cb" }
virtio-accel-tosa = { git = "https://github.com/MicroPerceptron/virtio-accel", rev = "8b66e79b6d889886fb22b0c9e72d868ff96fc9cb" }
virtio-accel-tosa-build = { git = "https://github.com/MicroPerceptron/virtio-accel", rev = "8b66e79b6d889886fb22b0c9e72d868ff96fc9cb" }
virtio-accel-vulkan = { git = "https://github.com/MicroPerceptron/virtio-accel", rev = "8b66e79b6d889886fb22b0c9e72d868ff96fc9cb", optional = true }
virtio-accel-coreml = { git = "https://github.com/MicroPerceptron/virtio-accel", rev = "8b66e79b6d889886fb22b0c9e72d868ff96fc9cb", optional = true }

[build-dependencies]
bindgen = "0.72.1"

[profile.release]
panic = "abort"
lto = "thin"

[profile.dev]
panic = "abort"
