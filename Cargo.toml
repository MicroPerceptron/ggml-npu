[package]
name = "ggml-npu"
version = "0.0.1"
edition = "2021"
description = "Universal NPU backend for ggml — Phase 0 skeleton (CPU fallback + NpuHal seam)"
license = "MIT"
publish = false

[lib]
# What ggml dlopens. Cargo emits `libggml_npu.so` (underscore); load it explicitly
# via GGML_BACKEND_PATH, so the exact filename does not matter for discovery.
crate-type = ["cdylib"]

[dependencies]
# no_std building blocks for the JIT blob cache: a spinlock/once (no core::Mutex) and a
# no_std HashMap (foldhash default hasher; nightly allocator_api for Global).
spin = { version = "0.9", default-features = false, features = ["mutex", "spin_mutex", "once"] }
# Use hashbrown's stable allocator path (allocator-api2), not its "nightly" feature, which
# hits a specialization break on current nightly.
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "allocator-api2"] }

[build-dependencies]
bindgen = "0.72.1"

# no_std crate: no unwinding runtime, so panic = "abort" in every profile. A panic in
# a vtable entry hits the #[panic_handler] in src/lib.rs, which calls libc abort() —
# UB-free across the C ABI (the no_std replacement for the old catch_unwind firewall).
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = "fat"
codegen-units = 1
opt-level = 3
